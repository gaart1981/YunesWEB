<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — YunesWEB</title>
  <meta name="description" content="Page de démarrage du projet YunesWEB.">
  <style>
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --text: #e8eaed;
      --muted: #8b929e;
      --accent: #5eead4;
      --border: #262b35;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fbfbfc;
        --surface: #ffffff;
        --text: #1a1d23;
        --muted: #6b7280;
        --accent: #0d9488;
        --border: #e5e7eb;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      animation: reveal .5s ease-out both;
    }

    .eyebrow {
      margin: 0 0 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 16px 0 0;
      border-top: 1px solid var(--border);
      list-style: none;
    }

    .meta li {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }

    @media (max-width: 480px) {
      main { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YunesWEB</p>
    <h1>Hello, World&nbsp;!</h1>
    <p>yunes nu ty blin daesh eto blin nachalo tvoey kompaniii )))).</p>
    <ul class="meta">
      <li>index.html</li>
      <li>HTML5</li>
      <li>Aucune dépendance</li>
    </ul>
  </main>
</body>
</html>
